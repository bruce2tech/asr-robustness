# Model presets for the benchmark.
#
# `key`      selects the adapter (whisper | wav2vec2 | espnet | stub).
# `model_id` selects the specific checkpoint / model-zoo tag.
#
# Experiment configs (configs/experiments/*.yaml) reference these by copying
# the {name, key, model_id} triple into their `models:` list.

models:
  whisper-tiny:
    key: whisper
    model_id: openai/whisper-tiny
  whisper-base:
    key: whisper
    model_id: openai/whisper-base
  whisper-small:
    key: whisper
    model_id: openai/whisper-small

  wav2vec2-base:
    key: wav2vec2
    model_id: facebook/wav2vec2-base-960h
  wav2vec2-robust:
    key: wav2vec2
    model_id: facebook/wav2vec2-large-robust-ft-libri-960h

  # ESPnet model-zoo tag for a LibriSpeech Conformer (pretrained benchmark peer).
  espnet-conformer:
    key: espnet
    model_id: espnet/simpleoier_librispeech_asr_train_asr_conformer7_wavlm_large_raw_en_bpe5000_sp
