# Phase 6 wav2vec 2.0 ablation A: clean fine-tune of wav2vec 2.0-large on
# LibriSpeech train-clean-100. This is the within-architecture baseline that
# the multi-condition variant (wav2vec2_mct_ft.yaml) has to beat under
# degradation. The two share every hyperparameter, so within this
# architecture the only variable across the pair is whether the training
# audio is degraded -- that's the ablation.
#
# Model size choice: wav2vec 2.0-large (~317M params) is chosen over
# wav2vec 2.0-base (~95M) to size-match whisper-small (244M) within ~30 %.
# This narrows -- though does not eliminate -- the size confound in the
# cross-architecture comparison (see wav2vec2_mct_ft.yaml for the full
# confound discussion).
#
# Other hyperparameters mirror configs/train/clean_ft.yaml (the Whisper
# baseline) wherever the wav2vec 2.0 recipe permits.

model_id: facebook/wav2vec2-large-960h
train_manifest: manifests/librispeech_train-clean-100.jsonl
eval_manifest: manifests/librispeech_dev-clean.jsonl
eval_limit: 200          # ~5 minutes / eval; stable WER signal

# No `augmentation:` block -- this is the clean-FT baseline. The dataset
# returns features extracted straight from the original LibriSpeech audio.

output_dir: results/checkpoints/wav2vec2-large-clean-ft
seed: 0

training:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5              # matches Whisper FT for cross-arch parity
  warmup_steps: 500
  max_steps: 4000                    # ~5 epochs over train-clean-100
  gradient_checkpointing: false      # L40S 48GB has the headroom
  # Precision: fp32. Both bf16 and fp16 caused training divergence to NaN
  # gradients within a few hundred steps with wav2vec2-large + CTC.
  # Diagnosis chain:
  #   * bf16 attempt: eval_loss=nan, eval_wer=1.0 by step 1000. CTC's
  #     log(sum(products)) math underflows in bf16's reduced mantissa.
  #   * fp16 attempt: grad_norm=nan from step ~50, scheduler stuck at
  #     warmup-step-0 (lr=0), model never updates, eval at step 1000 just
  #     returns off-the-shelf WER. The fp16 grad scaler was skipping every
  #     optimizer step due to gradient overflow at the randomly-initialized
  #     masked_spec_embed.
  # fp32 eliminates both failure modes -- ~2x slower per step on L40S but
  # plenty of VRAM headroom and the training actually progresses.
  bf16: false
  fp16: false
  max_grad_norm: 1.0                 # default; fp32 doesn't need tight clipping
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 2
  logging_steps: 50
  dataloader_num_workers: 4
  report_to: none
